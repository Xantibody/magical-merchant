name = "magical-merchant-sync"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# AIDEV-NOTE: opt into the Promise fix without changing unrelated compatibility defaults.
compatibility_flags = ["unhandled_rejection_after_microtask_checkpoint"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "magical-merchant-data"

[vars]
# ログインの寿命。同期する端末は半分を過ぎた同期で更新するので、切れるのは
# この日数まるごと同期しなかった端末だけ。既定の 3 日では、週末を挟むだけで
# 切れていた。更新の上限は JWT_MAX_SESSION_SECONDS(既定 180 日)。
JWT_EXPIRY_SECONDS = "2592000"

# 1 バケット = 1 人。R2 のキーはユーザーごとに分かれていないので、別の
# アカウントで入ると同じノートを取り合う。通す Google の `sub` をカンマ
# 区切りで並べると、その人だけが同期できる。
# sub は https://<worker>/auth/google でログインしたあとの JWT の payload、
# または Google Cloud Console のユーザー一覧で確認できる。
#
# AIDEV-NOTE: ALLOWED_SUBS は secret に置く。このリポジトリは public で、
# ここに書くと Google アカウント ID が公開されたまま消せない
# (wrangler secret put ALLOWED_SUBS — 同名を両方に置くことはできない)
#
# secret も無いなら誰でも通る。置いて空にすると誰も通らない — 締めるつもり
# の設定ミスでバケットが全開になるより、同期が 403 で止まるほうが気づける。

# cargo-deny, run by `just rust::check`. The advisories, bans and sources
# checks fail the build; licenses only warn for now (see [licenses]).

[graph]
# What ships (macOS, Android) and what CI builds on (Linux). Windows-only
# crates would otherwise add advisories and licenses for a platform no one runs
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
all-features = true

[advisories]
# Unmaintained transitive crates (fxhash, proc-macro-error and the unic-* family
# through tauri, mach through battery) cannot be replaced from here; only a
# direct dependency going unmaintained is ours to act on
unmaintained = "workspace"
ignore = [
  # quick-xml 0.38 via plist via tauri; fixed in 0.41, which no plist release
  # accepts yet. tauri parses only the bundle's own Info.plist with it, never a
  # note or anything a sync carries. Drop once tauri's plist moves past it
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via tauri's plist reads only our own Info.plist; no upgrade path yet" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via tauri's plist reads only our own Info.plist; no upgrade path yet" },
]

[licenses]
# Every license the graph uses today. Whether each belongs here is the
# project's call and has not been made yet, so `just rust::check` passes
# `-W rejected -W unlicensed` and a new license warns instead of failing.
# Drop those flags once this list has been reviewed.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# xtask is publish = false and carries no license
private = { ignore = true }

[bans]
# Matches clippy's multiple_crate_versions = "allow" in Cargo.toml: versions of
# transitive dependencies are not ours to unify. rustls is the one exception,
# guarded by `just rust::check-rustls`
multiple-versions = "allow"
# The only wildcards are the path dependencies between workspace crates, and
# allow-wildcard-paths does not cover crates without publish = false. Nothing
# here goes to crates.io, so a path dependency is the intended shape
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

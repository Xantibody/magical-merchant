[package]
name = "magical-merchant-app"
version = "0.3.0"
edition = "2021"
description = "Tauri desktop and mobile shell for the Magical Merchant note-taking app"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "magical_merchant_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magical-merchant-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-geolocation = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["macros", "sync"] }
# 署名は検証せず exp を覗くだけなので、crypto backend (aws_lc_rs / rust_crypto)
# も PEM 読み込みも要らない。既定のまま入れると使わない実装を丸ごと抱える
jsonwebtoken = { version = "11", default-features = false }
url = "2"
hostname = "0.4"
sha2 = "0.11"
tauri-plugin-opener = "2"
urlencoding = "2.1.3"
base64 = "0.23"

[target.'cfg(not(target_os = "android"))'.dependencies]
battery = "0.7"

[target.'cfg(target_os = "android")'.dependencies]
# The home screen widget's capture sheet calls into the core through JNI.
jni = "0.22"
# 逆ジオコーディングは端末の Context を要る Java API なので、tao が起動時に
# 預けた VM と Activity をここから借りる。
ndk-context = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 既定では全ヘッダと dispatch2 / contacts まで引き込む。使うのは測位と
# 逆ジオコーディングだけなので、その 4 つに絞る。
objc2-core-location = { version = "0.3", default-features = false, features = [
  "CLLocation",
  "CLLocationManager",
  "CLGeocoder",
  "CLPlacemark",
  "block2",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSError",
  "NSLocale",
  "NSString",
] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

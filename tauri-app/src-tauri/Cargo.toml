[package]
name = "magical-merchant-app"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop and mobile shell for the Magical Merchant note-taking app"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "magical_merchant_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magical-merchant-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-geolocation = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["macros"] }
jsonwebtoken = "9"
url = "2"
hostname = "0.4"
sha2 = "0.10"
tauri-plugin-opener = "2"
urlencoding = "2.1.3"
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
battery = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 既定では全ヘッダと block2 / dispatch2 / contacts まで引き込む。使うのは
# 測位だけなので、CLLocationManager と CLLocation の 2 つに絞る。
objc2-core-location = { version = "0.3", default-features = false, features = [
  "CLLocation",
  "CLLocationManager",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

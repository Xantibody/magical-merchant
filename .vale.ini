# Lints source comments (Vale extracts them with tree-sitter; string literals
# are never seen). `rs = md` and friends make backticked spans read as code, so
# an identifier or a path inside backticks is skipped by every rule.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
rs = md
ts = md
tsx = md
js = md

[*.{rs,ts,tsx,js,css}]
BasedOnStyles = MM, proselint
# Flags NOTE/TODO/FIXME as leftovers; AIDEV-NOTE and HACK(...) are the house
# anchors (see the global CLAUDE.md), so the rule would fire on every one
proselint.Annotations = NO

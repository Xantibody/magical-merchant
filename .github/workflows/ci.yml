name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# 連続 push で古い run を走らせ続けない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# キャッシュは main でだけ保存する (save/purge の条件と actions/cache の
# restore/save 分割はすべてこのため)。PR ごとに保存すると重複分で repo の
# 10GB 上限を超え、LRU 追い出しで macOS の nix store キャッシュが毎回消えて
# nix-package-macos が常にフルビルド (10 分) になっていた。PR は main の
# キャッシュを restore するだけ。purge-created: 0 + purge-primary-key: never
# は「保存時に同じ prefix の古い世代を消し、main に 1 世代だけ残す」の意

jobs:
  # 変更検出を1ジョブに集約し、各ジョブをジョブ単位で gate する。
  # ステップ単位の if だと、走らないジョブでも runner と checkout の時間を消費する
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # push / workflow_dispatch では filter を回さないので空になる → 全ジョブ実行
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      workers: ${{ steps.filter.outputs.workers || 'true' }}
      nix-package: ${{ steps.filter.outputs.nix-package || 'true' }}
      nix-mcp: ${{ steps.filter.outputs.nix-mcp || 'true' }}
      android: ${{ steps.filter.outputs.android || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust:
              - 'core/**'
              - 'tauri-app/src-tauri/**'
              - 'cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'justfile'
              - 'rust/justfile'
            frontend:
              - 'tauri-app/src/**'
              - 'tauri-app/dev/**'
              - '.oxlintrc.json'
              - 'tauri-app/.oxlintrc.json'
              - 'tauri-app/package.json'
              - 'tauri-app/pnpm-lock.yaml'
              - 'tauri-app/tsconfig.json'
              - 'tauri-app/tsconfig.dev.json'
              - 'tauri-app/vite.config.ts'
              - 'tauri-app/vitest.config.ts'
              - 'tauri-app/justfile'
              - 'flake.nix'
              - 'flake.lock'
            workers:
              - 'workers/**'
              - '.oxlintrc.json'
              - 'flake.nix'
              - 'flake.lock'
            nix-package:
              - 'tauri-app/pnpm-lock.yaml'
              - 'tauri-app/package.json'
              - 'nix/package.nix'
              - 'flake.nix'
              - 'flake.lock'
            # core/** はここに入れない。core が壊れれば rust ジョブが先に落ちるし、
            # 15 分のビルドを core の変更のたびに足すと待ち時間だけが増える。
            # android 限定でコンパイルされる widget_bridge.rs は src-tauri なので拾える
            # このジョブの定義そのものを変えたときは workflow_dispatch で回す。
            # push / 手動実行では filter を通さないので全ジョブが走る。
            # ci.yml をここに入れると、フロントのジョブを 1 行直しただけで
            # 12 分の APK ビルドが乗る
            nix-mcp:
              - 'nix/cli.nix'
              - 'cli/**'
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
            android:
              - 'tauri-app/android-widget/**'
              - 'tauri-app/src-tauri/**'
              - 'tauri-app/justfile'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Free disk space は置かない。store 3G + target で 21GB の空きに収まる。
      # rm -rf に 87 秒かかっていた
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-rust-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-rust-
          gc-max-store-size-linux: 3G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-rust-
          purge-created: 0
          purge-primary-key: never
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: check
        run: nix develop .#rust --command just rust::check
      # 実機の Android でしか出ない不具合なので、ここで止める。理由は rust/justfile
      - name: rustls resolves to one version
        run: nix develop .#rust --command just rust::check-rustls
      - name: test
        run: nix develop .#rust --command just rust::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-frontend-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-frontend-
          gc-max-store-size-linux: 3G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-frontend-
          purge-created: 0
          purge-primary-key: never
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(nix develop .#frontend --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: pnpm-store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('tauri-app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: check
        run: nix develop .#frontend --command just tauri_app::check
      - name: test
        run: nix develop .#frontend --command just tauri_app::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

  workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-workers-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-workers-
          gc-max-store-size-linux: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-workers-
          purge-created: 0
          purge-primary-key: never
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(nix develop .#workers --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: pnpm-store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-workers-${{ runner.os }}-${{ hashFiles('workers/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-workers-${{ runner.os }}-
      - name: check
        run: nix develop .#workers --command just workers::check
      - name: test
        run: nix develop .#workers --command just workers::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

  # ホーム画面ウィジェットの Kotlin とレイアウトは、ここでしか壊れが分からない。
  # `R.id.*` の解決も、apply-widget.go が書き込んだマニフェストが通るかも、
  # APK を組んで初めて確かめられる。無かった間は「実機に入れるまで気付かない」
  # ままマージできてしまっていた。
  #
  # 署名しない debug ビルド。配布物ではなく「組み上がるか」だけを見る。
  # ABI も aarch64 だけ: x86 系はエミュレータ専用で、検証したいのは
  # コンパイルとリソースの解決であって ABI ごとの差ではない。
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # rm -rf に 72 秒かかるので、キャッシュ復元と並行してバックグラウンドで消す。
      # APK ビルドが始まる頃(2 分後)には終わっている
      - name: Free disk space (background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &
      - uses: nixbuild/nix-quick-install-action@v35
      # キーは release.yml と揃えてある。SDK と NDK は同じものなので、
      # どちらが先に走っても取り直さない
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-android-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-android-
          gc-max-store-size-linux: 6G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-android-
          purge-created: 0
          purge-primary-key: never
      # rust ジョブとキーを分ける。同じ target/ でもホスト向けと Android 向けで
      # 中身が入れ替わり、共有すると毎回どちらかが作り直しになる
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-
      # ランナーが置く ANDROID_SDK_ROOT (/usr/local/lib/android/sdk) は落とす。
      # nix の devshell が入れる ANDROID_HOME と別の SDK を指すので、両方が
      # 生きていると Gradle が「SDK の場所が複数ある」と言って組み立てを拒む。
      # 上の rm がその実体を消すまでの間だけ起きるので、負けると落ちて勝つと
      # 通るレースになっていた。env を消すほうが待つより確実
      - name: Generate the Android project
        run: env -u ANDROID_SDK_ROOT nix develop .#android --command just tauri_app::android-init
      # android-setup を含む。ウィジェットのソースを入れた状態で組む
      - name: The debug APK builds
        run: env -u ANDROID_SDK_ROOT nix develop .#android --command just tauri_app::android-build-debug
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # pnpm-lock.yaml を変えると nix/package.nix の pnpmDeps.hash が黙って腐る。
  # 気付くのが macOS 配布 (nix build) の時では遅い
  nix-package:
    needs: changes
    if: needs.changes.outputs.nix-package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      # store キャッシュを張らない。FOD の出力パスは入力ではなく宣言した hash から
      # 決まるので、hash が腐ったままでも前回の出力が復元されれば nix はそれを有効と
      # 見なし、fetcher を一度も動かさないまま緑になる (実際 a1f8f48 がそうだった)。
      # 空の store から始めれば取得は必ず走る。取得の検証がこのジョブの全部なので、
      # ここでキャッシュが節約できるものは無い
      - name: pnpm deps hash is current
        run: nix build .#pnpm-deps --no-link

  # nix build .#default が macOS 配布そのもの。バンドラは codesign や xattr を
  # 外部コマンドとして呼ぶので、ubuntu で緑でも darwin sandbox でだけ落ちる
  nix-package-macos:
    needs: changes
    if: needs.changes.outputs.nix-package == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-package-${{ hashFiles('flake.lock', 'flake.nix', 'nix/package.nix', 'Cargo.lock', 'tauri-app/pnpm-lock.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-package-
          gc-max-store-size-macos: 4G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-package-
          purge-created: 0
          purge-primary-key: never
      - name: the .app bundle builds
        run: nix build .#default --no-link

  # nix run github:Xantibody/magical-merchant#mcp が AI クライアント側の
  # 起動方法そのもので、.#cli はその中身。cargo で緑でも fileset にファイルが漏れていれば nix だけ落ちる
  nix-mcp:
    needs: changes
    if: needs.changes.outputs.nix-mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-mcp-${{ hashFiles('flake.lock', 'flake.nix', 'nix/cli.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-mcp-
          gc-max-store-size-linux: 3G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-mcp-
          purge-created: 0
          purge-primary-key: never
      - name: the CLI (and the MCP entry point) builds and its tests pass
        run: nix build .#cli --no-link

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-format-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-format-
          gc-max-store-size-linux: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-format-
          purge-created: 0
          purge-primary-key: never
      - run: nix fmt -- --fail-on-change

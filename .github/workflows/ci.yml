name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# 連続 push で古い run を走らせ続けない。ただし main は殺さない:
# キャッシュの save と Cachix への push は main の run でしか起きないので、
# 15 分内に 2 度 merge すると、保存する唯一の run が消える。main では
# 後の run が前の run の完了を待って並ぶ (同じ group なので直列にはなる)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# キャッシュは main でだけ保存する (save/purge の条件と actions/cache の
# restore/save 分割はすべてこのため)。PR ごとに保存すると重複分で repo の
# 10GB 上限を超え、LRU 追い出しで macOS の nix store キャッシュが毎回消えて
# nix-package-macos が常にフルビルド (10 分) になっていた。PR は main の
# キャッシュを restore するだけ。purge-created: 0 + purge-primary-key: never
# は「保存時に同じ prefix の古い世代を消し、main に 1 世代だけ残す」の意

jobs:
  # 変更検出を1ジョブに集約し、各ジョブをジョブ単位で gate する。
  # ステップ単位の if だと、走らないジョブでも runner と checkout の時間を消費する
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # workflow_dispatch では filter を回さないので空になる → 全ジョブ実行。
      # 手で回すのは「filter を信用したくないとき」なので、そこだけは全部走らせる
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      workers: ${{ steps.filter.outputs.workers || 'true' }}
      nix-package: ${{ steps.filter.outputs.nix-package || 'true' }}
      macos-package: ${{ steps.filter.outputs.macos-package || 'true' }}
      nix-mcp: ${{ steps.filter.outputs.nix-mcp || 'true' }}
      android: ${{ steps.filter.outputs.android || 'true' }}
      comments: ${{ steps.filter.outputs.comments || 'true' }}
    steps:
      # AIDEV-NOTE: persist-credentials: false は公開リポジトリだから置ける。paths-filter の git fetch は匿名で通る
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # AIDEV-NOTE: base は既定 (= 既定ブランチ) のまま。push では action 側が github.event.before に読み替える
      # base を明示しないのは、既定ブランチと push 先が同じとき action が
      # payload.before を使い、初回 push (全 0 の SHA) も自前で捌くため。
      # base: ${{ github.event.before }} と書くと後者を自分で持つことになる
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            # .github/actions/** はここにだけ入れる。setup-nix は全 nix ジョブが
            # 使うが、7 つ全部の filter に入れると action の 1 行直しが 45 分の
            # APK ビルドを連れてくる。rust はそれを使うジョブの中で一番安い
            rust:
              - '.github/actions/**'
              - 'core/**'
              - 'tauri-app/src-tauri/**'
              - 'cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'justfile'
              - 'rust/justfile'
            # tauri_app::check が読むものは漏らさず並べる (tauri-app/justfile:9-14)。
            # knip.jsonc だけを直した PR でジョブが飛ぶと、落ちるのは merge 後の main
            frontend:
              - 'tauri-app/src/**'
              - 'tauri-app/dev/**'
              - 'tauri-app/index.html'
              - 'tauri-app/public/**'
              - '.oxlintrc.json'
              - 'tauri-app/.oxlintrc.json'
              - 'tauri-app/knip.jsonc'
              - 'tauri-app/package.json'
              - 'tauri-app/pnpm-lock.yaml'
              - 'tauri-app/pnpm-workspace.yaml'
              - 'tauri-app/tsconfig.json'
              - 'tauri-app/tsconfig.dev.json'
              - 'tauri-app/vite.config.ts'
              - 'tauri-app/vitest.config.ts'
              - 'tauri-app/justfile'
              - 'flake.nix'
              - 'flake.lock'
            workers:
              - 'workers/**'
              - '.oxlintrc.json'
              - 'flake.nix'
              - 'flake.lock'
            nix-package:
              - 'tauri-app/pnpm-lock.yaml'
              - 'tauri-app/package.json'
              - 'nix/package.nix'
              - 'flake.nix'
              - 'flake.lock'
            # AIDEV-NOTE: nix/package.nix と nix/cli.nix の fileset の写し。ここが狭いと Cachix が古い .app を持ったままになる
            # nix-package (pnpmDeps.hash の検証だけ) より広い。macOS のジョブは
            # .#default と .#cli を建てて Cachix に push するので、その 2 つの
            # 入力が動いたら必ず走らせる。手元の nix profile install が 10 分の
            # 建て直しに戻らないことが、10 倍レートを払う理由そのもの
            macos-package:
              - 'core/**'
              - 'cli/**'
              - 'tauri-app/src/**'
              - 'tauri-app/src-tauri/**'
              - 'tauri-app/index.html'
              - 'tauri-app/package.json'
              - 'tauri-app/pnpm-lock.yaml'
              - 'tauri-app/vite.config.ts'
              - 'tauri-app/tsconfig.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'nix/package.nix'
              - 'nix/cli.nix'
              - 'flake.nix'
              - 'flake.lock'
            nix-mcp:
              - 'nix/cli.nix'
              - 'cli/**'
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
            # core/** はここに入れない。core が壊れれば rust ジョブが先に落ちるし、
            # 15 分のビルドを core の変更のたびに足すと待ち時間だけが増える。
            # android 限定でコンパイルされる widget_bridge.rs は src-tauri なので拾える
            # このジョブの定義そのものを変えたときは workflow_dispatch で回す。
            # 手動実行だけは filter を通さないので全ジョブが走る。
            # ci.yml をここに入れると、フロントのジョブを 1 行直しただけで
            # 12 分の APK ビルドが乗る
            android:
              - 'tauri-app/android-widget/**'
              # android-build-debug は android-setup 経由で apply-tls.go も回す
              - 'tauri-app/android-tls/**'
              - 'tauri-app/src-tauri/**'
              - 'tauri-app/justfile'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
            # Everything the comments job reads
            comments:
              - '**/*.rs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.css'
              - '.vale.ini'
              - '.vale/**'
              - 'typos.toml'
              - 'scripts/comments-changed/**'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # store 3G + target で 21GB の空きに「収まっていた」が、2026-09-17 から
      # 同じキャッシュ・同じ image で cargo の crate 取得が ENOSPC で落ちる。
      # android と同じく、キャッシュ復元と並行してバックグラウンドで消す
      # (前面で消すと 87 秒かかる)
      - name: Free disk space (background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &
      - uses: ./.github/actions/setup-nix
        with:
          name: rust
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: check
        run: nix develop .#rust --command just rust::check
      # 実機の Android でしか出ない不具合なので、ここで止める。理由は rust/justfile
      - name: rustls resolves to one version
        run: nix develop .#rust --command just rust::check-rustls
      - name: test
        run: nix develop .#rust --command just rust::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: frontend
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(nix develop .#frontend --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: pnpm-store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('tauri-app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: check
        run: nix develop .#frontend --command just tauri_app::check
      - name: test
        run: nix develop .#frontend --command just tauri_app::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

  workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: workers
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
          max-store-size: 2G
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(nix develop .#workers --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: pnpm-store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-workers-${{ runner.os }}-${{ hashFiles('workers/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-workers-${{ runner.os }}-
      - name: check
        run: nix develop .#workers --command just workers::check
      - name: test
        run: nix develop .#workers --command just workers::test
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

  # ホーム画面ウィジェットの Kotlin とレイアウトは、ここでしか壊れが分からない。
  # `R.id.*` の解決も、apply-widget.go が書き込んだマニフェストが通るかも、
  # APK を組んで初めて確かめられる。無かった間は「実機に入れるまで気付かない」
  # ままマージできてしまっていた。
  #
  # 署名しない debug ビルド。配布物ではなく「組み上がるか」だけを見る。
  # ABI も aarch64 だけ: x86 系はエミュレータ専用で、検証したいのは
  # コンパイルとリソースの解決であって ABI ごとの差ではない。
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rm -rf に 72 秒かかるので、キャッシュ復元と並行してバックグラウンドで消す。
      # APK ビルドが始まる頃(2 分後)には終わっている
      - name: Free disk space (background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &
      # name は release.yml と揃えてある。SDK と NDK は同じものなので、
      # どちらが先に走っても取り直さない
      - uses: ./.github/actions/setup-nix
        with:
          name: android
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
          max-store-size: 6G
      # rust ジョブとキーを分ける。同じ target/ でもホスト向けと Android 向けで
      # 中身が入れ替わり、共有すると毎回どちらかが作り直しになる
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-
      # ランナーが置く ANDROID_SDK_ROOT (/usr/local/lib/android/sdk) は落とす。
      # nix の devshell が入れる ANDROID_HOME と別の SDK を指すので、両方が
      # 生きていると Gradle が「SDK の場所が複数ある」と言って組み立てを拒む。
      # 上の rm がその実体を消すまでの間だけ起きるので、負けると落ちて勝つと
      # 通るレースになっていた。env を消すほうが待つより確実
      - name: Generate the Android project
        run: env -u ANDROID_SDK_ROOT nix develop .#android --command just tauri_app::android-init
      # android-setup を含む。ウィジェットのソースを入れた状態で組む
      - name: The debug APK builds
        run: env -u ANDROID_SDK_ROOT nix develop .#android --command just tauri_app::android-build-debug
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # pnpm-lock.yaml を変えると nix/package.nix の pnpmDeps.hash が黙って腐る。
  # 気付くのが macOS 配布 (nix build) の時では遅い
  nix-package:
    needs: changes
    if: needs.changes.outputs.nix-package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      # store キャッシュを張らない。FOD の出力パスは入力ではなく宣言した hash から
      # 決まるので、hash が腐ったままでも前回の出力が復元されれば nix はそれを有効と
      # 見なし、fetcher を一度も動かさないまま緑になる (実際 a1f8f48 がそうだった)。
      # 空の store から始めれば取得は必ず走る。取得の検証がこのジョブの全部なので、
      # ここでキャッシュが節約できるものは無い
      - name: pnpm deps hash is current
        run: nix build .#pnpm-deps --no-link

  # nix build .#default が macOS 配布そのもの。バンドラは codesign や xattr を
  # 外部コマンドとして呼ぶので、ubuntu で緑でも darwin sandbox でだけ落ちる。
  # 走らせるのは main への push だけ。macOS runner は分単価が ubuntu の 10 倍で、
  # このジョブ 1 回が他の全ジョブの合計より高い。PR で拾えるのは darwin sandbox
  # 特有の失敗だけで、それは merge 後の 1 回で足りる
  nix-package-macos:
    needs: changes
    if: needs.changes.outputs.macos-package == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: package
          hash: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/package.nix', 'Cargo.lock', 'tauri-app/pnpm-lock.yaml') }}
          max-store-size: 4G
      - name: the .app bundle builds
        run: nix build .#default --no-link
      # ここで組んだ aarch64-darwin の .app と cli を Cachix に置く。手元の
      # `nix profile install` / darwin-rebuild が Tauri アプリを建て直す 10 分が消える。
      # skipPush で自動 push を止め、下で出力だけを明示的に push する。自動 push だと
      # store に restore されなかった回にだけ Rust toolchain ごと上がり、5 GiB を食う。
      # 明示 push なら restore で組まなかった回でも出力は必ず上がる (post-build-hook は
      # 組んだときにしか鳴らない)
      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/main'
        with:
          name: magical-merchant
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: publish the .app bundle and the CLI
        if: github.ref == 'refs/heads/main'
        run: nix build .#default .#cli --no-link --print-out-paths | cachix push magical-merchant

  # nix run github:Xantibody/magical-merchant#mcp が AI クライアント側の
  # 起動方法そのもので、.#cli はその中身。cargo で緑でも fileset にファイルが漏れていれば nix だけ落ちる
  nix-mcp:
    needs: changes
    if: needs.changes.outputs.nix-mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: mcp
          hash: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/cli.nix', 'Cargo.lock') }}
      - name: the CLI (and the MCP entry point) builds and its tests pass
        run: nix build .#cli --no-link

  # ワークフロー自身の検査。ci.yml は 400 行を超えていて、式の書き間違いも
  # トークンの置き残しも、これまでは誰も見ていなかった。actionlint が構文と式を、
  # zizmor が持ち出しやすい書き方 (認証情報の置き残し、run への式の直接展開) を見る。
  #
  # ここだけは nix devshell を通さない。flake.nix に 2 つ足すと paths-filter が
  # それを rust/frontend/workers/android すべての入力として拾うので、
  # ワークフローの lint を足す変更が 45 分の APK ビルドを連れてくる
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@v2
      # 方針は .github/zizmor.yml
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          advanced-security: false
          min-severity: low
          config: .github/zizmor.yml

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: format
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
          max-store-size: 2G
      - run: nix fmt -- --fail-on-change

  # Source comments are English and spelled right (justfile: comments). Vale
  # is applied to the lines this run added, not to whole files: the tree still
  # carries Japanese comments from before the switch, and a one-line fix must
  # not have to translate the 100 lines around it. typos covers the whole tree
  comments:
    needs: changes
    if: needs.changes.outputs.comments == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # HEAD^1 is the base: on a PR the merge commit's first parent is
          # main, on a push to main it is the previous main
          fetch-depth: 2
      - uses: ./.github/actions/setup-nix
        with:
          name: comments
          hash: ${{ hashFiles('flake.lock', 'flake.nix') }}
          max-store-size: 2G
      - run: nix develop .#comments --command just comments-changed HEAD^1

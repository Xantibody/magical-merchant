name: Publish

# The nix distributions for macOS and Linux, called from ci.yml's package
# stage on a push to main only, once the checks the app is made of passed.
# Each job builds .#default and .#cli and pushes them to Cachix, which takes
# the 10 minutes of rebuilding the Tauri app off a local
# `nix profile install`, darwin-rebuild or nixos-rebuild.
#
# What a PR can learn from these builds is platform packaging alone (the
# darwin bundler, the Linux wrappers). The fileset and the NixOS module are
# checked on every PR by ci.yml's nix-cli and nixos-module, so one run after
# the merge is enough for the rest; a macOS runner costs 10x an ubuntu one
# per minute, and one macOS run costs more than every other job together
#
# skipPush stops cachix-action's automatic push and the last step pushes the
# outputs only: pushed automatically, the runs where the store was not
# restored upload the Rust toolchain too, 5 GiB. Pushed explicitly, the
# outputs go up even on a run that restored them instead of building (the
# post-build hook fires only on a build)
on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # nix build .#default is the macOS distribution itself. The bundler calls
  # codesign and xattr as external commands, so it can fail in the darwin
  # sandbox alone while ubuntu is green
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          name: package
          hash: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/package.nix', 'Cargo.lock', 'tauri-app/pnpm-lock.yaml') }}
          max-store-size: 4G
      - name: the .app bundle builds
        run: nix build .#default --no-link
      - uses: cachix/cachix-action@v17
        with:
          name: magical-merchant
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: publish the .app bundle and the CLI
        run: nix build .#default .#cli --no-link --print-out-paths | cachix push magical-merchant

  # x86_64-linux: cargo-tauri.hook builds the .deb and unpacks its usr/ tree,
  # and wrapGAppsHook3 wraps the binary. The rust job compiles the same crate,
  # but a missing buildInput or wrapper only shows up here. No store cache:
  # any source change rebuilds the whole app derivation, and everything else
  # comes from cache.nixos.org or Cachix
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space (background)
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: magical-merchant
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: the app builds and wraps
        run: |
          out=$(nix build .#default --no-link --print-out-paths)
          test -x "$out/bin/magical-merchant-app"
          grep -q 'x-scheme-handler/magical-merchant' "$out"/share/applications/*.desktop
      - name: publish the app and the CLI
        run: nix build .#default .#cli --no-link --print-out-paths | cachix push magical-merchant

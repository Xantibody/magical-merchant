name: "Set up Nix with a cached store"
description: >
  nix-quick-install と cache-nix-action の組。7 つのジョブが同じ 10 行を名前と
  サイズだけ変えて持っていたので、ここに 1 回だけ置く。キャッシュを main でだけ
  保存する理由と purge の意味は ci.yml 冒頭のコメントにある。

inputs:
  name:
    description: >
      キャッシュの名前空間。ジョブごとに分ける。共有すると別の devshell が入った
      store を取り合い、どちらも毎回取り直しになる
    required: true
  hash:
    description: >
      primary-key に混ぜるハッシュ。どのファイルがそのジョブの入力かはジョブしか
      知らないので、hashFiles() は呼び出し側で評価して渡す
    required: true
  max-store-size:
    description: 保存前に gc する上限
    required: false
    default: "3G"
  restore-only:
    description: >
      true なら保存も purge もしない。タグ ref で走る release.yml 用で、そこで
      保存するとタグごとに重複したキャッシュが 10GB の上限を圧迫する
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@v35
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ inputs.name }}-${{ inputs.hash }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ inputs.name }}-
        gc-max-store-size: ${{ inputs.max-store-size }}
        save: ${{ inputs.restore-only != 'true' && github.ref == 'refs/heads/main' }}
        purge: ${{ inputs.restore-only != 'true' && github.ref == 'refs/heads/main' }}
        purge-prefixes: nix-${{ runner.os }}-${{ inputs.name }}-
        purge-created: 0
        purge-primary-key: never

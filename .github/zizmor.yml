# ci.yml の workflows ジョブが読む zizmor の設定。
# https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # 既定の blanket policy は SHA 固定を要求するが、ここは版タグで止める。
        # renovate.json5 の github-actions グループが週 1 で上げているので版は
        # 追えているし、SHA 固定にすると 1 行ごとに「どの版か」のコメントを
        # 添えないとレビューできなくなる
        "*": ref-pin
  self-repository:
    ignore:
      # `./.github/actions/...` は同じリポジトリの action を呼ぶ documented な
      # 書き方。zizmor が勧める `$/...` は新しく、動かなかったときに壊れるのが
      # 全 nix ジョブなので、こちらが当たり前になるまで待つ
      - ci.yml
      - release.yml
  cache-poisoning:
    ignore:
      # release.yml は main の CI が保存した nix store キャッシュを restore して
      # 署名 APK を組む。そのキャッシュを書けるのは main に入ったコミットだけで、
      # main に入れられる人はこのワークフロー自体を書き換えられる。つまり
      # キャッシュは新しい権限を足していない。外すと配信のたびに 45 分の
      # コールドビルドに戻る
      - release.yml
